services:
  - type: web
    name: paws-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"   # tighten to your Vercel URL(s) after the frontend is deployed
